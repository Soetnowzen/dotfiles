# remap prefix from 'C-b' to 'C-a' {
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# }

# Nesting local and remote sessions {
# Also, change some visual styles when window keys are off
bind -T root F12  \
       set prefix None \;\
       set key-table off \;\
       set status-style "fg=green,bg=brightblack" \;\
       if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
       refresh-client -S \;\

bind -T off F12 \
       set -u prefix \;\
       set -u key-table \;\
       run-shell "~/dotfiles/tmux/apply-theme.sh" \;\
       refresh-client -S
# }

# split panes using | and - {
bind | split-window -h
bind -n M-| split-window -h
bind - split-window -v
bind -n M-- split-window -v
unbind '"'
unbind %
# }

# Terminal settings with true color support {
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# }

# alt+keybinding {
# vim navigation
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-n next-window
bind -n M-p previous-window
bind -n M-c new-window
bind -n M-d detach-client
bind -n M-q display-panes

bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1
bind -n M-Left resize-pane -L 1
bind -n M-Right resize-pane -R 1
# }

# reload config file {
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
# }

# Allows for faster key repetition
set -s escape-time 0
# Extend the repeat interval for repeatable commands (e.g., resize-pane)
set -sg repeat-time 1001

# Design {
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# rename window to reflect current directory and program
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}:#{pane_current_command}"
# renumber windows when a window is closed
set -g renumber-windows on

#set terminal title
# No #() here: the title is re-rendered on every redraw, and a subprocess in
# it costs far more than the uptime string it produced was worth.
set -g set-titles on
set -g set-titles-string '(#S) #h [#I.#P: #W]|Pane: #P|%a %H:%M %d/%m'

# slightly longer pane indicators display time
set -g display-panes-time 800
# slightly longer status messages display time
set -g display-time 1000

# Scroll History
# ~1 kB per 120-col line, so this is a ~10 MB/pane ceiling (allocated lazily,
# only as output is actually produced). Was 30000, i.e. ~30 MB/pane.
set -g history-limit 10000

set -g xterm-keys on

set-window-option -g visual-bell on
# set-window-option -g bell-action other
# }

## Status bar design {
# status line
set -g status-justify left
# The clock below only has minute resolution, so a 1s refresh bought nothing
# while re-running every #() once per second per attached client.
set -g status-interval 5

# Resolve $USER once instead of spawning whoami on every refresh.
# -b is required: a foreground run-shell during config load has its `set -g`
# clobbered when parsing finishes.
run-shell -b 'tmux set -g @user "${USER:-$(id -un)}"'

# window status
setw -g window-status-separator |
setw -g window-status-format " #I.#P: #W#F "
setw -g window-status-current-format " #I.#P: #W#F "
set -g status-justify centre

# Info on left
set -g status-left '(#S) #{@user}@#h'
set -g status-left-length 40

# Info on right
# Load average, not uptime: the old `uptime | cut | cut` rendered a duration
# ("15:15") that read like a second clock next to %H:%M. One process instead
# of four, and /proc/loadavg needs no parsing.
set -g status-right 'Pane: #P|%a %H:%M %d/%m|#(cut -d " " -f 1-3 /proc/loadavg)#[default] '
set -g status-right-length 80
# }

# Mouse {
# This used to be gated on `echo "$TMUX_VERSION >= 2.1" | bc`, which is a
# syntax error for a version like "3.3a" -- bc printed nothing, both branches
# tested false, and mouse silently stayed off. The old <2.1 / <2.2 branches
# targeted tmux versions this config will never meet again.
set -g mouse on

# set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# OSC 52: lets tmux set the system clipboard directly, with no xclip process
# and no X server -- which also means it keeps working over SSH. Windows
# Terminal supports it. The xclip copy-mode bindings below still work as-is.
set-option -s set-clipboard on
# bind-key -t vi-copy MouseDragEnd1Pane copy-pipe "xclip -se c -i"

# Allow mouse to select which pane to use
# set -g mouse-select-pane on

# # Allow mouse dragging to resize panes
# set -g mouse-resize-pane on

# # Allow mouse to select windows
# set -g mouse-select-window on
# }

# pane movement {
bind-key ! choose-window 'join-pane -h -s "%%"'
bind-key @ choose-window 'join-pane -h -t "%%"'
bind-key + command-prompt "break-pane -t :"
# }

# Additional helpful features {
# Aggressive resize - resize window to smallest client actively viewing it
setw -g aggressive-resize on

# Enable focus events for better vim/editor integration
set -g focus-events on

# Clear screen and history
bind C-l send-keys 'C-l' \; clear-history

# Toggle pane synchronization (send commands to all panes)
bind S set-window-option synchronize-panes \; display-message "Synchronize panes: #{?synchronize-panes,ON,OFF}"

# Easier window swapping
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Session management shortcuts
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Quick pane layouts
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled
# }

# Notify if other windows has activities {
setw -g monitor-activity on
set -g visual-activity on
# }

# set vi keys {
unbind [ # ]
bind Escape copy-mode
setw -g mode-keys vi

# Modern vi-mode copy/paste bindings (tmux 2.4+)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clipboard integration
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Paste from clipboard
bind p run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"
bind C-p paste-buffer
# }

# Dynamic theme — Solarized dark/light matched to terminal background {
# Passthrough lets OSC 11 reach the outer terminal when nested in tmux
set -g allow-passthrough on

# Initial theme at server start. Must be -b: a foreground run-shell during
# config load has its `set -g` clobbered once the config finishes parsing.
# run-shell has no tty either, so this only gets the clock fallback; `tm`
# re-runs the script from the shell, where OSC 11 can reach the terminal.
run-shell -b "~/dotfiles/tmux/apply-theme.sh"

# prefix+T re-detects (clock-based, since run-shell has no tty).
# prefix+M-l / prefix+M-d force a theme.
bind T     run-shell "~/dotfiles/tmux/apply-theme.sh"       \; display-message "Theme: #{TERM_THEME}"
bind M-l   run-shell "~/dotfiles/tmux/apply-theme.sh light" \; display-message "Theme: light"
bind M-d   run-shell "~/dotfiles/tmux/apply-theme.sh dark"  \; display-message "Theme: dark"
# }
